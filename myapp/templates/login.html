<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Access | ClientSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <main class="login-wrapper">
        <div class="archive-card">
            <section class="archive-visual">
                <div style="position:relative; z-index:2">
                    <span class="brand-small">Established Protocol</span>
                    <p style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic;">
                        "Every object has a story, and every story requires a keeper."
                    </p>
                </div>
                <div style="position:relative; z-index:2; font-size: 10px; letter-spacing: 2px;">
                    CLIENTSPHERE V.2.0
                </div>
            </section>

            <section class="archive-form-area">
                <div class="form-header">
                    <span class="brand-small">Secure Ledger Access</span>
                    <h2>Archive Login</h2>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="input-styling-container">
                    {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn-portal">Authenticate Access</button>
                </form>

                <p class="meta-text">Encryption Active • Authorized Entry Only</p>
                <a href="/" style="display:inline-block; margin-top: 20px; color: var(--accent-gold); font-size: 11px; text-decoration: none; letter-spacing: 1px; font-weight: 600;">&larr; Exit to Landing</a>
            </section>

        </div>
    </main>

</body>
</html>
